# AI Kitchen 前端 nginx 配置
# 静态托管 frontend/dist + 反向代理 /api 到后端容器

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 反向代理（axios baseURL 是 /api/v1）
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI 采集/摘要耗时较长，放宽超时
        proxy_send_timeout 300s;
    }

    # 后端健康检查
    location = /health {
        proxy_pass http://backend:8001/health;
        proxy_set_header Host $host;
    }

    # Vue history 路由回退：刷新 /menu、/recipes/123 等深层路由时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（文件名带 hash，可放心长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
