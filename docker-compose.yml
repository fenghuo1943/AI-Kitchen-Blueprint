# AI Kitchen Assistant 群晖 NAS 部署配置
#
# 设计原则（按你的要求）：
#   - 只用通用基础镜像（python / nginx），不构建自定义镜像
#   - 代码通过 bind mount 挂载进容器，改代码无需重新构建镜像
#   - 依赖在容器内手动安装，镜像保持最小
#
# 使用方式见 deploy/setup.md

services:
  backend:
    image: python:3.13-slim
    container_name: ai-kitchen-backend
    working_dir: /app
    # 代码挂载：后端整个目录映射进容器，改代码后重启容器即可生效
    volumes:
      - ./backend:/app
      # 入口脚本：首次启动自动装依赖，正常重启不重复装（镜像保持干净）
      - ./backend-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    # 仅启动命令；requirements.txt 有更新时按 setup.md 手动在容器内 pip install
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      # 让 Python 日志实时输出，避免 docker logs 看不到
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"
    networks:
      - kitchen
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: ai-kitchen-frontend
    volumes:
      # 前端构建产物：Windows 上 npm run build 后把 dist 传到 NAS 对应目录
      - ./frontend/dist:/usr/share/nginx/html:ro
      # nginx 配置：静态托管 + /api 反向代理到后端
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 若 80 端口被群晖 Web Station 占用，改成 8080:80
      - "8005:80"
    networks:
      - kitchen
    depends_on:
      - backend
    restart: unless-stopped

networks:
	kitchen:
		external: true