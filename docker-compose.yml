
# 使用方式见 deploy/setup.md

services:
  backend:
    image: python:3.13-slim
    container_name: ai-kitchen-backend
    working_dir: /app
    # 代码挂载：后端整个目录映射进容器，改代码后重启容器即可生效
    volumes:
      - ./backend:/app
      # Python 依赖直接映射到群晖硬盘：pip --user 装进 NAS 目录，重建容器不重装
      # 注意别映射到 /usr/local/lib/python3.13/site-packages（会盖住镜像自带 pip）
      - ./backend/data/python:/opt/pyuser
      # 入口脚本：requirements 变更时自动 pip install --user
      - ./backend-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    # 仅启动命令；用 python -m uvicorn，不依赖 PATH（依赖在 /opt/pyuser 用户目录）
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      # 让 Python 日志实时输出，避免 docker logs 看不到
      - PYTHONUNBUFFERED=1
      # Python 用户依赖装到 NAS 挂载目录（/opt/pyuser = backend/data/python）
      - PYTHONUSERBASE=/opt/pyuser
    ports:
      - "8001:8001"
    networks:
      - kitchen
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: ai-kitchen-frontend
    volumes:
      # 前端构建产物：Windows 上 npm run build 后把 dist 传到 NAS 对应目录
      - ./frontend/dist:/usr/share/nginx/html:ro
      # nginx 配置：静态托管 + /api 反向代理到后端
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书/私钥（自签或导入的正式证书；此目录已在 .gitignore，用 SMB/SSH 上传到 NAS）
      - /usr/syno/etc/certificate/_archive/Qi0mND:/etc/nginx/certs:ro
    ports:
      # 宿主端口:容器端口 —— 右边必须等于 nginx.conf 里的 listen（HTTP 8005 / HTTPS 8006）
      - "8005:8005"
      - "8006:8006"
    networks:
      - kitchen
    depends_on:
      - backend
    restart: unless-stopped

networks:
  kitchen:
    external: true