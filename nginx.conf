# AI Kitchen 前端 nginx 配置
# 静态托管 frontend/dist + 反向代理 /api 到后端容器
#
# 同一 server 块同时监听 HTTP(8005) 与 HTTPS(8006)，两个端口共用下面所有 location。
# ⚠️ 证书文件（./certs -> /etc/nginx/certs）必须先于容器启动存在，否则 nginx 启动失败，
#    生成方式见 deploy/setup.md「四、HTTPS 访问（端口 8006）」。

server {
    listen 8005;
    listen 8006 ssl;
    server_name _;

    # HTTPS 证书 / 私钥（挂载自宿主机 certs/ 目录，已在 .gitignore 中，勿提交私钥）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 反向代理（axios baseURL 是 /api/v1）
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI 采集/摘要耗时较长，放宽超时
        proxy_send_timeout 300s;
    }

    # 后端健康检查
    location = /health {
        proxy_pass http://backend:8001/health;
        proxy_set_header Host $host;
    }

    # Vue history 路由回退：刷新 /menu、/recipes/123 等深层路由时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（文件名带 hash，可放心长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
